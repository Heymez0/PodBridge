# Builds PodBridge on a GitHub-hosted runner and attaches it to the release.
#
# - Manual run (Actions > Release > Run workflow): builds and keeps the files as workflow artifacts only.
# - Pushing a tag such as v2.1.0: also uploads PodBridge.exe and the extension zip to the release for that tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Check that the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content PodBridge.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match <Version>$version</Version> in PodBridge.csproj" }

      - name: Publish
        run: dotnet publish PodBridge.csproj -c Release -o dist

      - name: Self-test
        shell: pwsh
        run: |
          # PodBridge is a GUI app; piping its output makes PowerShell wait for it and keep the exit code.
          dist\PodBridge.exe --selftest | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "Self-test failed" }

      - name: Package the browser extension
        shell: pwsh
        run: |
          $version = (Get-Content BrowserExtension\manifest.json | ConvertFrom-Json).version
          Compress-Archive -Path BrowserExtension\* -DestinationPath "dist\PodBridge-BrowserExtension-$version.zip"

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: PodBridge
          path: dist/PodBridge.exe
          if-no-files-found: error

      - name: Upload browser extension
        uses: actions/upload-artifact@v7
        with:
          name: PodBridge-BrowserExtension
          path: dist/PodBridge-BrowserExtension-*.zip
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $hash = (Get-FileHash dist\PodBridge.exe -Algorithm SHA256).Hash
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "PodBridge $($tag.TrimStart('v'))" --notes "SHA-256 of PodBridge.exe: ``$hash``"
          }
          gh release upload $tag dist\PodBridge.exe (Get-Item dist\PodBridge-BrowserExtension-*.zip).FullName --clobber
          Write-Host "PodBridge.exe SHA-256: $hash"
