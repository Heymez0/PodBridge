# Builds PodBridge on a GitHub-hosted runner, signs the executable through SignPath and attaches it to the release.
#
# - Manual run (Actions > Release > Run workflow): builds and keeps the files as workflow artifacts only.
# - Pushing a tag such as v2.1.0: also uploads PodBridge.exe and the extension zip to the release for that tag.
#
# Signing starts once the repository variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG and
# SIGNPATH_SIGNING_POLICY_SLUG and the secret SIGNPATH_API_TOKEN exist. Until then the build is unsigned.
# Every signing request still has to be approved by hand in SignPath before the signed file comes back.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Check that the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content PodBridge.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match <Version>$version</Version> in PodBridge.csproj" }

      - name: Publish
        run: dotnet publish PodBridge.csproj -c Release -o dist

      - name: Self-test
        shell: pwsh
        run: |
          # PodBridge is a GUI app; piping its output makes PowerShell wait for it and keep the exit code.
          dist\PodBridge.exe --selftest | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "Self-test failed" }

      - name: Package the browser extension
        shell: pwsh
        run: |
          $version = (Get-Content BrowserExtension\manifest.json | ConvertFrom-Json).version
          Compress-Archive -Path BrowserExtension\* -DestinationPath "dist\PodBridge-BrowserExtension-$version.zip"

      - name: Upload unsigned executable
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: PodBridge-unsigned
          path: dist/PodBridge.exe
          if-no-files-found: error

      - name: Upload browser extension
        uses: actions/upload-artifact@v7
        with:
          name: PodBridge-BrowserExtension
          path: dist/PodBridge-BrowserExtension-*.zip
          if-no-files-found: error

      - name: Sign with SignPath
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Check the signature
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature signed\PodBridge.exe
          if ($signature.Status -ne 'Valid') { throw "Signature is $($signature.Status)" }
          Write-Host "Signed by $($signature.SignerCertificate.Subject)"
          Copy-Item signed\PodBridge.exe dist\PodBridge.exe -Force

      - name: Upload signed executable
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: PodBridge-signed
          path: dist/PodBridge.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $hash = (Get-FileHash dist\PodBridge.exe -Algorithm SHA256).Hash
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "PodBridge $($tag.TrimStart('v'))" --notes "SHA-256 of PodBridge.exe: ``$hash``"
          }
          gh release upload $tag dist\PodBridge.exe (Get-Item dist\PodBridge-BrowserExtension-*.zip).FullName --clobber
          Write-Host "PodBridge.exe SHA-256: $hash"
