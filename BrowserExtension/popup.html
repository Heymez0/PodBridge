<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>PodBridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Text comes from _locales via data-i18n, so the popup follows the browser language. -->
  <header>
    <img src="icons/32.png" alt="" width="24" height="24">
    <h1 data-i18n="popupTitle"></h1>
  </header>

  <p id="status" class="status" data-i18n="statusLoading"></p>

  <button id="grant" class="primary" data-i18n="grantAccess" hidden></button>

  <label class="row">
    <span data-i18n="syncToggle"></span>
    <input id="enabled" type="checkbox" role="switch">
  </label>

  <div class="field">
    <div class="row">
      <span data-i18n="fineTune"></span>
      <output id="offsetLabel">0 ms</output>
    </div>
    <input id="offset" type="range" min="-300" max="300" step="10" value="0">
    <p class="hint" data-i18n="fineTuneHint"></p>
  </div>

  <p class="hint" data-i18n="drmHint"></p>

  <script src="popup.js"></script>
</body>
</html>
